<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>膳雉坊列印要求</title><style>body{margin:0;background:#f5f4ec;color:#14241f;font-family:system-ui,"Noto Sans TC",sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(440px,100%);background:#fff;border-radius:22px;padding:30px;box-shadow:0 15px 50px rgba(0,0,0,.12);text-align:center}.icon{font-size:52px}.card h1{margin:8px 0}.card p{line-height:1.7;color:#52635d}.order{font-weight:800;color:#991b1f}</style></head><body><main class="card"><div class="icon">{{ '✅' if ok else '⚠️' }}</div><h1>{{ '已送出列印' if ok else '未送出列印' }}</h1><div class="order">訂單 {{ order_id }}</div><p>{{ message }}</p><p>現在可以關閉此頁，列印結果請查看店內電腦或印表機。</p></main></body></html>
